---
# Argo CD keeps superlab-dev in sync with kustomize/overlays/dev on main:
# a merged change rolls out without kubectl, and manual drift is reverted.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: superlab-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/EnmanuelMejia/devops-superlab.git
    targetRevision: main
    path: kustomize/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: superlab-dev
  # The HPA owns the replica count. Without this, selfHeal would reset every
  # scale-up back to the replicas value in Git.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - RespectIgnoreDifferences=true
