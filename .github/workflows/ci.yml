name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Service and context safety tests
        run: bash scripts/run-tests.sh
      - name: Shell syntax
        run: for script in scripts/*.sh; do bash -n "$script"; done
      - name: Documentation and YAML checks
        run: |
          pip install -r requirements-docs.txt
          yamllint .
          mkdocs build --strict
      - name: Render local Kustomize overlays
        run: |
          for env in dev stage prod; do
            kubectl kustomize "kustomize/overlays/$env" > "/tmp/superlab-$env.yaml"
          done
      - name: Verify registry policy examples
        run: |
          curl --fail --location --output /tmp/opa \
            https://github.com/open-policy-agent/opa/releases/download/v1.21.1/opa_linux_amd64_static
          echo '668506eb17a2eaa1fce6cc0d1f42ef85125d4ac5bda5fc74d1152d0c77145031  /tmp/opa' | sha256sum --check
          chmod +x /tmp/opa
          /tmp/opa test policies/conftest -v
      - name: Build local demo image without registry writes
        run: docker build -t superlab-health-demo:ci samples/health-service
