---
# Production-shaped: three replicas spread across nodes, more headroom per
# pod, and a disruption budget that keeps two serving during node drains.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: superlab-prod
labels:
  - pairs:
      environment: prod
resources:
  - namespace.yaml
  - ../../base
  - pdb.yaml
configMapGenerator:
  - name: podinfo-config
    behavior: merge
    literals:
      - PODINFO_UI_MESSAGE=DevOps SuperLab · prod
replicas:
  - name: podinfo
    count: 3
patches:
  - target:
      kind: HorizontalPodAutoscaler
      name: podinfo
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 3
      - op: replace
        path: /spec/maxReplicas
        value: 6
  - target:
      kind: Deployment
      name: podinfo
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 100m
            memory: 96Mi
          limits:
            cpu: "1"
            memory: 256Mi
      - op: add
        path: /spec/template/spec/topologySpreadConstraints
        value:
          - maxSkew: 1
            topologyKey: kubernetes.io/hostname
            whenUnsatisfiable: ScheduleAnyway
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: podinfo
